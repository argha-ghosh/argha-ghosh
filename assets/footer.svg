<svg xmlns="http://www.w3.org/2000/svg" width="810" height="236" viewBox="0 0 810 236" role="img" aria-label="Code. Add. Commit. Push. Repeat.">
<style>
text{font-family:'Segoe UI',-apple-system,Ubuntu,sans-serif}
.cmd{font-family:'Fira Code','Courier New',monospace;font-size:11px}
</style>
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#1a1b27"/><stop offset="1" stop-color="#201a3a"/></linearGradient>
<linearGradient id="g" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#8B5CF6"/><stop offset="1" stop-color="#f0abfc"/></linearGradient>
<filter id="blur" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="6"/></filter>
</defs>
<rect x=".5" y=".5" width="809" height="235" rx="14" fill="url(#bg)" stroke="#2d2a4a"/>
<path id="track" d="M80,88 H720 A42,42 0 0 1 720,172 H80 A42,42 0 0 1 80,88 Z" fill="none" stroke="#2d2a4a" stroke-width="2" stroke-dasharray="6 6"/>
<g><circle r="12" fill="#f0abfc" opacity=".45" filter="url(#blur)"/><circle r="5.5" fill="#fff"/><animateMotion dur="12.0s" repeatCount="indefinite" path="M80,88 H720 A42,42 0 0 1 720,172 H80 A42,42 0 0 1 80,88 Z"/></g>
<g>
<rect x="60" y="62" width="140" height="52" rx="26" fill="#1a1b27" stroke="#8B5CF6" stroke-opacity=".45"/>
<text x="130" y="96" text-anchor="middle" font-size="22" font-weight="700" fill="#c4b5fd" fill-opacity=".6">Code.</text>
<text x="130" y="131" text-anchor="middle" class="cmd" fill="#8b8fa8">$ code .</text>
<g opacity="0"><animate attributeName="opacity" dur="12.0s" repeatCount="indefinite" values="0;0;1;1;0;0" keyTimes="0;0.0000;0.0250;0.1074;0.1324;1"/>
<rect x="60" y="62" width="140" height="52" rx="26" fill="url(#g)"/>
<text x="130" y="96" text-anchor="middle" font-size="22" font-weight="800" fill="#fff">Code.</text>
<text x="130" y="131" text-anchor="middle" class="cmd" fill="#f0abfc">$ code .</text></g></g>
<g>
<rect x="230" y="62" width="140" height="52" rx="26" fill="#1a1b27" stroke="#8B5CF6" stroke-opacity=".45"/>
<text x="300" y="96" text-anchor="middle" font-size="22" font-weight="700" fill="#c4b5fd" fill-opacity=".6">Add.</text>
<text x="300" y="131" text-anchor="middle" class="cmd" fill="#8b8fa8">$ git add .</text>
<g opacity="0"><animate attributeName="opacity" dur="12.0s" repeatCount="indefinite" values="0;0;1;1;0;0" keyTimes="0;0.1008;0.1258;0.2175;0.2425;1"/>
<rect x="230" y="62" width="140" height="52" rx="26" fill="url(#g)"/>
<text x="300" y="96" text-anchor="middle" font-size="22" font-weight="800" fill="#fff">Add.</text>
<text x="300" y="131" text-anchor="middle" class="cmd" fill="#f0abfc">$ git add .</text></g></g>
<g>
<rect x="400" y="62" width="140" height="52" rx="26" fill="#1a1b27" stroke="#8B5CF6" stroke-opacity=".45"/>
<text x="470" y="96" text-anchor="middle" font-size="22" font-weight="700" fill="#c4b5fd" fill-opacity=".6">Commit.</text>
<text x="470" y="131" text-anchor="middle" class="cmd" fill="#8b8fa8">$ git commit</text>
<g opacity="0"><animate attributeName="opacity" dur="12.0s" repeatCount="indefinite" values="0;0;1;1;0;0" keyTimes="0;0.2109;0.2359;0.3276;0.3526;1"/>
<rect x="400" y="62" width="140" height="52" rx="26" fill="url(#g)"/>
<text x="470" y="96" text-anchor="middle" font-size="22" font-weight="800" fill="#fff">Commit.</text>
<text x="470" y="131" text-anchor="middle" class="cmd" fill="#f0abfc">$ git commit</text></g></g>
<g>
<rect x="570" y="62" width="140" height="52" rx="26" fill="#1a1b27" stroke="#8B5CF6" stroke-opacity=".45"/>
<text x="640" y="96" text-anchor="middle" font-size="22" font-weight="700" fill="#c4b5fd" fill-opacity=".6">Push.</text>
<text x="640" y="131" text-anchor="middle" class="cmd" fill="#8b8fa8">$ git push</text>
<g opacity="0"><animate attributeName="opacity" dur="12.0s" repeatCount="indefinite" values="0;0;1;1;0;0" keyTimes="0;0.3211;0.3461;0.4377;0.4627;1"/>
<rect x="570" y="62" width="140" height="52" rx="26" fill="url(#g)"/>
<text x="640" y="96" text-anchor="middle" font-size="22" font-weight="800" fill="#fff">Push.</text>
<text x="640" y="131" text-anchor="middle" class="cmd" fill="#f0abfc">$ git push</text></g></g>
<g>
<rect x="330" y="146" width="140" height="52" rx="26" fill="#1a1b27" stroke="#8B5CF6" stroke-opacity=".45"/>
<text x="400" y="180" text-anchor="middle" font-size="22" font-weight="700" fill="#c4b5fd" fill-opacity=".6">Repeat.</text>
<text x="400" y="215" text-anchor="middle" class="cmd" fill="#8b8fa8">$ repeat</text>
<g opacity="0"><animate attributeName="opacity" dur="12.0s" repeatCount="indefinite" values="0;0;1;1;0;0" keyTimes="0;0.6656;0.6906;0.7823;0.8073;1"/>
<rect x="330" y="146" width="140" height="52" rx="26" fill="url(#g)"/>
<text x="400" y="180" text-anchor="middle" font-size="22" font-weight="800" fill="#fff">Repeat.</text>
<text x="400" y="215" text-anchor="middle" class="cmd" fill="#f0abfc">$ repeat</text></g></g>
</svg>