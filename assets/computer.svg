<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 370" width="800" height="370" role="img" aria-label="Argha Ghosh developer workstation boot animation" xmlns:c2pa="http://c2pa.org/manifest">
  <style>
    text { font-family: 'Fira Code', 'Courier New', monospace; font-size: 15px; }
    .p { fill: #c4b5fd; } .g { fill: #22c55e; } .w { fill: #e5e7eb; } .m { fill: #6b7280; }
    .n { fill: #f0abfc; font-weight: 700; } .c { fill: #67e8f9; }
    .clip { animation-duration: 12s; animation-iteration-count: infinite; animation-fill-mode: both; }
    .a1{animation-name:k1} .a2{animation-name:k2} .a3{animation-name:k3}
    .a4{animation-name:k4} .a5{animation-name:k5} .a6{animation-name:k6}
    .bar{animation:kb 12s infinite both}
    .pct{animation:kp 12s infinite both}
    .cur{animation:blink 1s steps(1) infinite}
    .curg{animation:kc 12s infinite both}
    .led{animation:pulse 2s ease-in-out infinite}
    .glow{animation:glow 4s ease-in-out infinite}
    .scan{animation:scan 5s linear infinite}
    .f{animation-duration:12s;animation-iteration-count:infinite;animation-fill-mode:both}
    .f1{animation-name:f1} .f2{animation-name:f2} .f3{animation-name:f3}
    .f4{animation-name:f4} .f5{animation-name:f5} .f6{animation-name:f6}
    @keyframes k1{0%,2%{width:0;animation-timing-function:steps(21)}9%,95%{width:420px}100%{width:0}}
    @keyframes k2{0%,11%{width:0;animation-timing-function:steps(35)}19%,95%{width:420px}100%{width:0}}
    @keyframes kb{0%,21%{width:0;animation-timing-function:steps(20)}42%,95%{width:396px}100%{width:0}}
    @keyframes kp{0%,21%{opacity:0}22%,95%{opacity:1}100%{opacity:0}}
    @keyframes k3{0%,44%{width:0;animation-timing-function:steps(14)}49%,95%{width:420px}100%{width:0}}
    @keyframes k4{0%,52%{width:0;animation-timing-function:steps(21)}60%,95%{width:420px}100%{width:0}}
    @keyframes k5{0%,62%{width:0;animation-timing-function:steps(41)}74%,95%{width:420px}100%{width:0}}
    @keyframes k6{0%,77%{width:0;animation-timing-function:steps(23)}85%,95%{width:420px}100%{width:0}}
    @keyframes kc{0%,85%{opacity:0}86%,95%{opacity:1}100%{opacity:0}}
    @keyframes f1{0%,24%{opacity:0;transform:translateX(10px)}28%,95%{opacity:1;transform:none}100%{opacity:0}}
    @keyframes f2{0%,29%{opacity:0;transform:translateX(10px)}33%,95%{opacity:1;transform:none}100%{opacity:0}}
    @keyframes f3{0%,34%{opacity:0;transform:translateX(10px)}38%,95%{opacity:1;transform:none}100%{opacity:0}}
    @keyframes f4{0%,39%{opacity:0;transform:translateX(10px)}43%,95%{opacity:1;transform:none}100%{opacity:0}}
    @keyframes f5{0%,44%{opacity:0;transform:translateX(10px)}48%,95%{opacity:1;transform:none}100%{opacity:0}}
    @keyframes f6{0%,49%{opacity:0;transform:translateX(10px)}53%,95%{opacity:1;transform:none}100%{opacity:0}}
    @keyframes blink{0%,100%{opacity:1}50%{opacity:0}}
    @keyframes pulse{0%,100%{opacity:.35}50%{opacity:1}}
    @keyframes glow{0%,100%{opacity:.25}50%{opacity:.6}}
    @keyframes scan{0%{transform:translateY(-30px)}100%{transform:translateY(250px)}}
  </style>

  <defs>
    <linearGradient id="bezel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2a2745"/><stop offset="1" stop-color="#15131f"/>
    </linearGradient>
    <linearGradient id="screen" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d1117"/><stop offset="1" stop-color="#150f2b"/>
    </linearGradient>
    <linearGradient id="stand" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2a2745"/><stop offset="1" stop-color="#15131f"/>
    </linearGradient>
    <linearGradient id="scanl" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8B5CF6" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#8B5CF6" stop-opacity="0.12"/>
      <stop offset="1" stop-color="#8B5CF6" stop-opacity="0"/>
    </linearGradient>
    <pattern id="lines" width="4" height="4" patternUnits="userSpaceOnUse">
      <rect width="4" height="1" fill="#ffffff" opacity="0.035"/>
    </pattern>
    <filter id="blur" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="9"/></filter>
    <clipPath id="screenclip"><rect x="46" y="24" width="708" height="240" rx="8"/></clipPath>
    <clipPath id="c1"><rect class="clip a1" x="70" y="68" width="0" height="26"/></clipPath>
    <clipPath id="c2"><rect class="clip a2" x="70" y="96" width="0" height="26"/></clipPath>
    <clipPath id="c3"><rect class="clip a3" x="70" y="156" width="0" height="26"/></clipPath>
    <clipPath id="c4"><rect class="clip a4" x="70" y="184" width="0" height="26"/></clipPath>
    <clipPath id="c5"><rect class="clip a5" x="70" y="212" width="0" height="26"/></clipPath>
    <clipPath id="c6"><rect class="clip a6" x="70" y="240" width="0" height="20"/></clipPath>
  </defs>

  <!-- ambient glow -->
  <rect class="glow" x="30" y="8" width="740" height="272" rx="18" fill="none" stroke="#8B5CF6" stroke-width="6" filter="url(#blur)"/>
  <ellipse cx="400" cy="352" rx="240" ry="8" fill="#8B5CF6" opacity="0.18" filter="url(#blur)"/>

  <!-- monitor body -->
  <rect x="30" y="8" width="740" height="272" rx="18" fill="url(#bezel)" stroke="#8B5CF6" stroke-width="1.5"/>
  <circle cx="400" cy="16" r="2" fill="#374151"/>
  <rect x="46" y="24" width="708" height="240" rx="8" fill="url(#screen)"/>

  <!-- title bar -->
  <path d="M46 32a8 8 0 0 1 8-8h692a8 8 0 0 1 8 8v20H46z" fill="#1a1730"/>
  <circle cx="64" cy="38" r="5" fill="#ef4444"/>
  <circle cx="82" cy="38" r="5" fill="#eab308"/>
  <circle cx="100" cy="38" r="5" fill="#22c55e"/>
  <text x="400" y="42" text-anchor="middle" class="m" style="font-size:12px">argha-ghosh@aiub: ~/portfolio</text>

  <!-- terminal (left) -->
  <g clip-path="url(#c1)"><text x="70" y="86"><tspan class="g">$</tspan><tspan class="w"> boot argha-ghosh.os</tspan></text></g>
  <g clip-path="url(#c2)"><text x="70" y="114"><tspan class="g">[ OK ]</tspan><tspan class="p"> Loading skills &amp; projects...</tspan></text></g>

  <rect x="70" y="128" width="400" height="14" rx="4" fill="#0d1117" stroke="#8B5CF6"/>
  <rect class="bar" x="72" y="130" width="0" height="10" rx="2" fill="#8B5CF6"/>
  <text class="pct m" x="476" y="140" style="font-size:11px">100%</text>

  <g clip-path="url(#c3)"><text x="70" y="174"><tspan class="g">[ OK ]</tspan><tspan class="w"> System ready</tspan></text></g>
  <g clip-path="url(#c4)"><text x="70" y="202"><tspan class="p">&gt;</tspan><tspan class="w"> Hi, I'm </tspan><tspan class="n">Argha Ghosh</tspan></text></g>
  <g clip-path="url(#c5)"><text x="70" y="230"><tspan class="p">&gt;</tspan><tspan class="c"> Full-Stack • Mobile • Desktop Developer</tspan></text></g>
  <g clip-path="url(#c6)"><text x="70" y="256"><tspan class="p">&gt;</tspan><tspan class="w"> Building PathSathi...</tspan></text></g>
  <g class="curg"><rect class="cur" x="278" y="243" width="9" height="15" fill="#8B5CF6"/></g>

  <!-- stack panel (right) -->
  <rect x="520" y="62" width="218" height="190" rx="8" fill="#0d1117" fill-opacity="0.6" stroke="#2d2a4a"/>
  <text x="536" y="84" class="m" style="font-size:12px">~/stack</text>
  <line x1="536" y1="92" x2="722" y2="92" stroke="#2d2a4a"/>

  <g class="f f1"><circle cx="540" cy="112" r="4" fill="#61DAFB"/><text x="554" y="117" class="w" style="font-size:13px">React Native + Expo</text></g>
  <g class="f f2"><circle cx="540" cy="138" r="4" fill="#512BD4"/><text x="554" y="143" class="w" style="font-size:13px">ASP.NET Core</text></g>
  <g class="f f3"><circle cx="540" cy="164" r="4" fill="#E0234E"/><text x="554" y="169" class="w" style="font-size:13px">NestJS + Next.js</text></g>
  <g class="f f4"><circle cx="540" cy="190" r="4" fill="#4169E1"/><text x="554" y="195" class="w" style="font-size:13px">PostgreSQL · MySQL</text></g>
  <g class="f f5"><circle cx="540" cy="216" r="4" fill="#239120"/><text x="554" y="221" class="w" style="font-size:13px">C# / .NET Desktop</text></g>
  <g class="f f6"><circle cx="540" cy="242" r="4" fill="#3178C6"/><text x="554" y="247" class="w" style="font-size:13px">TypeScript</text></g>

  <!-- screen effects -->
  <g clip-path="url(#screenclip)">
    <rect x="46" y="24" width="708" height="240" fill="url(#lines)"/>
    <rect class="scan" x="46" y="24" width="708" height="30" fill="url(#scanl)"/>
  </g>
  <rect x="46" y="24" width="708" height="240" rx="8" fill="none" stroke="#8B5CF6" stroke-opacity="0.25"/>

  <!-- power LED -->
  <circle class="led" cx="400" cy="272" r="2.5" fill="#22c55e"/>

  <!-- stand -->
  <path d="M368 280h64l14 48h-92z" fill="url(#stand)" stroke="#8B5CF6" stroke-width="1.5"/>
  <rect x="290" y="328" width="220" height="14" rx="7" fill="url(#stand)" stroke="#8B5CF6" stroke-width="1.5"/>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
