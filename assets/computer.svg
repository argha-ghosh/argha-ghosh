<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 340" width="800" height="340" role="img" aria-label="Computer booting up Argha Ghosh profile" xmlns:c2pa="http://c2pa.org/manifest">
  <style>
    text { font-family: 'Fira Code', 'Courier New', monospace; font-size: 16px; }
    .p { fill: #c4b5fd; }
    .g { fill: #22c55e; }
    .w { fill: #e5e7eb; }
    .m { fill: #6b7280; }
    .clip { animation-duration: 12s; animation-iteration-count: infinite; animation-fill-mode: both; }
    .a1 { animation-name: k1; }
    .a2 { animation-name: k2; }
    .a3 { animation-name: k3; }
    .a4 { animation-name: k4; }
    .a5 { animation-name: k5; }
    .a6 { animation-name: k6; }
    .bar { animation: kb 12s infinite both; }
    .cur { animation: blink 1s steps(1) infinite; }
    .led { animation: pulse 2s ease-in-out infinite; }
    @keyframes k1 { 0%,2% {width:0; animation-timing-function:steps(22)} 9%,95% {width:700px} 100% {width:0} }
    @keyframes k2 { 0%,11% {width:0; animation-timing-function:steps(26)} 19%,95% {width:700px} 100% {width:0} }
    @keyframes kb { 0%,21% {width:0; animation-timing-function:steps(20)} 42%,95% {width:400px} 100% {width:0} }
    @keyframes k3 { 0%,44% {width:0; animation-timing-function:steps(12)} 49%,95% {width:700px} 100% {width:0} }
    @keyframes k4 { 0%,52% {width:0; animation-timing-function:steps(26)} 62%,95% {width:700px} 100% {width:0} }
    @keyframes k5 { 0%,64% {width:0; animation-timing-function:steps(32)} 75%,95% {width:700px} 100% {width:0} }
    @keyframes k6 { 0%,77% {width:0; animation-timing-function:steps(24)} 86%,95% {width:700px} 100% {width:0} }
    @keyframes blink { 0%,100% {opacity:1} 50% {opacity:0} }
    @keyframes pulse { 0%,100% {opacity:.4} 50% {opacity:1} }
  </style>

  <defs>
    <clipPath id="c1"><rect class="clip a1" x="76" y="62" width="0" height="26"/></clipPath>
    <clipPath id="c2"><rect class="clip a2" x="76" y="90" width="0" height="26"/></clipPath>
    <clipPath id="c3"><rect class="clip a3" x="76" y="148" width="0" height="26"/></clipPath>
    <clipPath id="c4"><rect class="clip a4" x="76" y="176" width="0" height="26"/></clipPath>
    <clipPath id="c5"><rect class="clip a5" x="76" y="204" width="0" height="26"/></clipPath>
    <clipPath id="c6"><rect class="clip a6" x="76" y="232" width="0" height="26"/></clipPath>
  </defs>

  <!-- monitor -->
  <rect x="40" y="10" width="720" height="260" rx="16" fill="#1e1e2e" stroke="#8B5CF6" stroke-width="2"/>
  <rect x="56" y="26" width="688" height="228" rx="8" fill="#0d1117"/>
  <circle cx="74" cy="42" r="5" fill="#ef4444"/>
  <circle cx="92" cy="42" r="5" fill="#eab308"/>
  <circle cx="110" cy="42" r="5" fill="#22c55e"/>
  <text x="400" y="47" text-anchor="middle" class="m" style="font-size:12px">argha-ghosh@aiub: ~</text>
  <line x1="56" y1="54" x2="744" y2="54" stroke="#1f2937"/>

  <!-- terminal lines -->
  <g clip-path="url(#c1)"><text x="76" y="80"><tspan class="g">$</tspan><tspan class="w"> boot argha-ghosh.os</tspan></text></g>
  <g clip-path="url(#c2)"><text x="76" y="108"><tspan class="g">[ OK ]</tspan><tspan class="p"> Loading skills &amp; projects...</tspan></text></g>

  <rect x="76" y="124" width="400" height="14" rx="3" fill="none" stroke="#8B5CF6"/>
  <rect class="bar" x="78" y="126" width="0" height="10" rx="2" fill="#8B5CF6"/>

  <g clip-path="url(#c3)"><text x="76" y="168"><tspan class="g">[ OK ]</tspan><tspan class="w"> System ready</tspan></text></g>
  <g clip-path="url(#c4)"><text x="76" y="196"><tspan class="p">&gt;</tspan><tspan class="w"> Hi, I'm Argha Ghosh</tspan></text></g>
  <g clip-path="url(#c5)"><text x="76" y="224"><tspan class="p">&gt;</tspan><tspan class="w"> Full-Stack • Mobile • Desktop Developer</tspan></text></g>
  <g clip-path="url(#c6)"><text x="76" y="252"><tspan class="p">&gt;</tspan><tspan class="w"> Building PathSathi...</tspan></text></g>
  <rect class="cur" x="330" y="238" width="9" height="16" fill="#8B5CF6"/>

  <!-- power LED -->
  <circle class="led" cx="400" cy="262" r="3" fill="#22c55e"/>

  <!-- stand -->
  <polygon points="365,270 435,270 450,315 350,315" fill="#1e1e2e" stroke="#8B5CF6" stroke-width="2"/>
  <rect x="300" y="315" width="200" height="12" rx="6" fill="#1e1e2e" stroke="#8B5CF6" stroke-width="2"/>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
